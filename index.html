<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCHILA DIGITAL ARCADE PRO MAX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
   margin:0;
   padding:0;
   box-sizing:border-box;
   font-family:'Poppins',sans-serif;
}

body{
   display:flex;
   height:100vh;
   overflow:hidden;
   background:linear-gradient(135deg,#020617,#0f172a,#111827);
   color:white;
   animation:fundoRGB 10s infinite alternate;
}

@keyframes fundoRGB{
   0%{background-position:left;}
   100%{background-position:right;}
}

/* LOADING */
#loading{
   position:fixed;
   width:100%;
   height:100%;
   background:#000;
   z-index:9999;
   display:flex;
   justify-content:center;
   align-items:center;
   flex-direction:column;
   color:#38bdf8;
   font-size:30px;
   text-shadow:0 0 20px #38bdf8;
}

.loader{
   width:200px;
   height:10px;
   background:#111;
   margin-top:20px;
   border-radius:20px;
   overflow:hidden;
}

.loader span{
   display:block;
   height:100%;
   width:0%;
   background:#38bdf8;
   box-shadow:0 0 20px #38bdf8;
   animation:carregar 3s forwards;
}

@keyframes carregar{
   to{width:100%;}
}

/* SIDEBAR */
.sidebar{
   width:280px;
   background:#020617;
   border-right:2px solid #38bdf8;
   padding:20px;
   overflow-y:auto;
   box-shadow:0 0 20px #38bdf8;
}

.logo{
   text-align:center;
   font-size:22px;
   color:#38bdf8;
   margin-bottom:20px;
   text-shadow:0 0 10px #38bdf8;
}

.sidebar h2{
   font-size:14px;
   margin:15px 0 8px;
   color:#38bdf8;
}

.sidebar input{
   width:100%;
   padding:10px;
   border:none;
   border-radius:8px;
   background:#0f172a;
   color:white;
   outline:none;
}

.sidebar button, .atalhos a{
   width:100%;
   padding:10px;
   margin-top:8px;
   border:none;
   border-radius:8px;
   background:#1e293b;
   color:white;
   cursor:pointer;
   transition:.3s;
   text-decoration:none;
   display:block;
   text-align:center;
}

.sidebar button:hover, .atalhos a:hover{
   background:#38bdf8;
   color:black;
   transform:scale(1.05);
   box-shadow:0 0 15px #38bdf8;
}

/* CONTENT */
.content{
   flex:1;
   display:flex;
   flex-direction:column;
   padding:20px;
}

.statusbar{
   display:flex;
   justify-content:space-between;
   align-items:center;
   background:#020617;
   padding:12px 20px;
   border-radius:12px;
   box-shadow:0 0 15px #38bdf8;
   margin-bottom:15px;
}

#clock{
   color:#38bdf8;
   font-size:20px;
   font-weight:bold;
   text-shadow:0 0 10px #38bdf8;
}

.topbar{
   display:flex;
   justify-content:space-between;
   align-items:center;
   margin-bottom:15px;
}

.topbar h1{
   color:#38bdf8;
   text-shadow:0 0 10px #38bdf8;
}

.actions button{
   margin-left:8px;
   padding:10px 14px;
   border:none;
   border-radius:8px;
   background:#38bdf8;
   color:black;
   font-weight:bold;
   cursor:pointer;
   transition:.3s;
}

.actions button:hover{
   transform:scale(1.1);
   box-shadow:0 0 15px #38bdf8;
}

textarea{
   flex:1;
   background:#020617;
   color:#38bdf8;
   border:none;
   border-radius:15px;
   padding:20px;
   resize:none;
   font-size:15px;
   box-shadow:0 0 20px rgba(56,189,248,0.3);
}

textarea:focus{
   outline:none;
}

.atalhos{
   margin-top:20px;
}

.notificacao{
   position:fixed;
   top:20px;
   right:20px;
   background:#38bdf8;
   color:black;
   padding:12px 20px;
   border-radius:10px;
   display:none;
   font-weight:bold;
   box-shadow:0 0 20px #38bdf8;
}

.dark{
   background:#111;
}

.dark textarea{
   background:#1a1a1a;
   color:white;
}
</style>
</head>
<body>

<div id="loading">
   CARREGANDO MOCHILA DIGITAL...
   <div class="loader"><span></span></div>
</div>

<!-- SONS -->
<audio id="clickSound" src="click.mp3"></audio>
<audio id="selectSound" src="select.mp3"></audio>
<audio id="saveSound" src="save.mp3"></audio>
<audio id="music" src="music.mp3" loop></audio>

<div class="notificacao" id="notificacao">Salvo com sucesso!</div>

<div class="sidebar">
   <div class="logo">🎮 MOCHILA ARCADE</div>

   <h2>🔍 Buscar Matéria</h2>
   <input type="text" placeholder="Pesquisar..." onkeyup="filtrar(this.value)">

   <h2>📚 Matérias</h2>
   <div id="listaMaterias"></div>

   <div class="atalhos">
      <h2>🚀 Atalhos Extras</h2>
      <a href="aula.html" onclick="playClick()">💻 S.O JOÃO</a>
      <a href="direitoshumanos.html" onclick="playClick()">📘 D.H</a>
      <a href="placaM.html" onclick="playClick()">🖥 P.M</a>
      <a href="drogas.html" onclick="playClick()">🖥 DROGAS</a>
   </div>
</div>

<div class="content">

   <div class="statusbar">
      <div>STATUS: ONLINE</div>
      <div id="clock">00:00:00</div>
   </div>

   <div class="topbar">
      <h1 id="titulo">Selecione uma matéria</h1>

      <div class="actions">
         <button onclick="novo()">➕ Novo</button>
         <button onclick="salvar()">💾 Salvar</button>
         <button onclick="exportar()">📄 Exportar</button>
         <button onclick="modoEscuro()">🌙 Modo</button>
      </div>
   </div>

   <textarea id="editor" placeholder="Digite seus conteúdos aqui..."></textarea>

</div>
<script>

let materias = [
"Matemática","Português","História","Geografia","Biologia",
"Química","Física","HTML","CSS","POO Java","Lógica"
];

let materiaAtual = "";

/* ===========================
   SONS
=========================== */
function playClick(){
   document.getElementById("clickSound").play();
}
function playSelect(){
   document.getElementById("selectSound").play();
}
function playSave(){
   document.getElementById("saveSound").play();
}

/* ===========================
   INICIAR SISTEMA
=========================== */
window.onload = function(){

   carregarLista();
   atualizarRelogio();

   setInterval(atualizarRelogio,1000);

   let music = document.getElementById("music");
   music.volume = 0.2;

   document.body.addEventListener("click",()=>{
      music.play();
   },{once:true});

   setTimeout(()=>{
      document.getElementById("loading").style.display="none";
   },3000);

   /* salvar automático */
   setInterval(()=>{
      if(materiaAtual!=""){
         localStorage.setItem(materiaAtual,document.getElementById("editor").value);
      }
   },5000);
}

/* ===========================
   RELÓGIO
=========================== */
function atualizarRelogio(){
   let agora = new Date();
   let h = String(agora.getHours()).padStart(2,'0');
   let m = String(agora.getMinutes()).padStart(2,'0');
   let s = String(agora.getSeconds()).padStart(2,'0');

   document.getElementById("clock").innerText = h+":"+m+":"+s;
}

/* ===========================
   CARREGAR LISTA
=========================== */
function carregarLista(){
   let lista = document.getElementById("listaMaterias");
   lista.innerHTML="";

   materias.forEach(nome=>{
      let btn = document.createElement("button");
      btn.innerText = nome;

      btn.onclick = function(){
         playSelect();
         abrirMateria(nome);
      }

      lista.appendChild(btn);
   });
}

/* ===========================
   ABRIR MATÉRIA
=========================== */
function abrirMateria(nome){
   materiaAtual = nome;
   document.getElementById("titulo").innerText = nome;

   let texto = localStorage.getItem(nome);
   document.getElementById("editor").value = texto || "";
}

/* ===========================
   SALVAR
=========================== */
function salvar(){
   if(materiaAtual==""){
      alert("Escolha uma matéria primeiro!");
      return;
   }

   localStorage.setItem(materiaAtual,document.getElementById("editor").value);
   playSave();
   mostrarNotificacao("💾 Conteúdo salvo com sucesso!");
}

/* ===========================
   NOVA MATÉRIA
=========================== */
function novo(){
   playClick();

   let nome = prompt("Digite o nome da nova matéria:");
   if(nome){
      materias.push(nome);
      carregarLista();
      mostrarNotificacao("➕ Nova matéria adicionada!");
   }
}

/* ===========================
   EXPORTAR TXT
=========================== */
function exportar(){
   playClick();

   if(materiaAtual==""){
      alert("Escolha uma matéria!");
      return;
   }

   let texto = document.getElementById("editor").value;
   let blob = new Blob([texto],{type:"text/plain"});

   let a = document.createElement("a");
   a.href = URL.createObjectURL(blob);
   a.download = materiaAtual+".txt";
   a.click();

   mostrarNotificacao("📄 Arquivo exportado!");
}

/* ===========================
   FILTRO
=========================== */
function filtrar(valor){
   let botoes = document.querySelectorAll("#listaMaterias button");

   botoes.forEach(btn=>{
      btn.style.display = btn.innerText.toLowerCase().includes(valor.toLowerCase())
      ? "block" : "none";
   });
}

/* ===========================
   MODO ESCURO
=========================== */
function modoEscuro(){
   playClick();
   document.body.classList.toggle("dark");
   mostrarNotificacao("🌙 Modo alterado!");
}

/* ===========================
   NOTIFICAÇÃO
=========================== */
function mostrarNotificacao(msg){
   let n = document.getElementById("notificacao");
   n.innerText = msg;
   n.style.display="block";

   setTimeout(()=>{
      n.style.display="none";
   },2000);
}

/* ===========================
   SOM AO DIGITAR
=========================== */
document.addEventListener("keydown",function(){
   let som = document.getElementById("clickSound");
   som.currentTime = 0;
   som.play();
});

</script>
   
   &lt;h1&gt;Download de Arquivo&lt;/h1&gt;
&lt;a href=&quot;arquivos/exemplo.pdf&quot; download&gt;
&lt;button&gt;Baixar PDF&lt;/button&gt;
&lt;/a&gt;
</body>
</html>
