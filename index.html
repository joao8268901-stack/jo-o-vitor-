<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCHILA DIGITAL ARCADE ULTRA 2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
   margin:0;
   padding:0;
   box-sizing:border-box;
   font-family:'Poppins',sans-serif;
}

body{
   display:flex;
   height:100vh;
   overflow:hidden;
   color:white;
   background:linear-gradient(135deg,#020617,#0f172a,#111827,#000000);
   animation:fundoMove 15s infinite alternate;
}

@keyframes fundoMove{
   0%{background-position:left;}
   100%{background-position:right;}
}

/* LOGIN */
#loginTela{
   position:fixed;
   width:100%;
   height:100%;
   background:black;
   z-index:99999;
   display:flex;
   justify-content:center;
   align-items:center;
   flex-direction:column;
   color:#38bdf8;
   text-shadow:0 0 15px #38bdf8;
}

#loginTela h1{
   margin-bottom:20px;
   font-size:35px;
}

#loginTela input{
   padding:15px;
   width:300px;
   border:joao;
   border-radius:10px;
   margin-bottom:15px;
   background:#111827;
   color:white;
   text-align:center;
   font-size:18px;
}

#loginTela button{
   padding:12px 25px;
   border:joao;
   border-radius:10px;
   background:#38bdf8;
   cursor:pointer;
   font-weight:bold;
}

#loginTela button:hover{
   transform:scale(1.1);
   box-shadow:0 0 20px #38bdf8;
}

/* PARTÍCULAS */
canvas{
   position:fixed;
   top:0;
   left:0;
   z-index:-1;
}

/* SIDEBAR */
.sidebar{
   width:280px;
   background:rgba(2,6,23,0.9);
   border-right:2px solid #38bdf8;
   padding:20px;
   overflow-y:auto;
   box-shadow:0 0 20px #38bdf8;
}

.logo{
   text-align:center;
   font-size:22px;
   color:#38bdf8;
   margin-bottom:20px;
}

.avatar{
   text-align:center;
   margin-bottom:20px;
   font-size:60px;
}

#nomeAluno{
   text-align:center;
   margin-bottom:15px;
   color:#38bdf8;
}

.xpBar{
   width:100%;
   height:15px;
   background:#111;
   border-radius:20px;
   overflow:hidden;
   margin-bottom:20px;
}

.xpBar span{
   display:block;
   width:65%;
   height:100%;
   background:#38bdf8;
   box-shadow:0 0 15px #38bdf8;
}

.sidebar h2{
   font-size:14px;
   color:#38bdf8;
   margin:10px 0;
}

.sidebar input{
   width:100%;
   padding:10px;
   border:none;
   border-radius:8px;
   background:#111827;
   color:white;
}

.sidebar button,.atalhos a{
   width:100%;
   padding:10px;
   margin-top:8px;
   border:none;
   border-radius:8px;
   background:#1e293b;
   color:white;
   cursor:pointer;
   text-decoration:none;
   display:block;
   text-align:center;
   transition:.3s;
}

.sidebar button:hover,.atalhos a:hover{
   background:#38bdf8;
   color:black;
   transform:scale(1.05);
}

/* CONTENT */
.content{
   flex:1;
   display:flex;
   flex-direction:column;
   padding:20px;
}

.statusbar{
   display:flex;
   justify-content:space-between;
   background:rgba(2,6,23,0.9);
   padding:12px 20px;
   border-radius:12px;
   margin-bottom:15px;
   box-shadow:0 0 15px #38bdf8;
}

#clock,#contador{
   color:#38bdf8;
   font-weight:bold;
}

.topbar{
   display:flex;
   justify-content:space-between;
   align-items:center;
   margin-bottom:15px;
}

.topbar h1{
   color:#38bdf8;
}

.actions button{
   margin-left:8px;
   padding:10px 14px;
   border:none;
   border-radius:8px;
   background:#38bdf8;
   color:black;
   cursor:pointer;
   font-weight:bold;
}

textarea{
   flex:1;
   background:rgba(2,6,23,0.9);
   color:#38bdf8;
   border:none;
   border-radius:15px;
   padding:20px;
   resize:none;
   font-size:15px;
}

.painelExtra{
   display:flex;
   gap:15px;
   margin-top:15px;
}

.card{
   flex:1;
   background:rgba(2,6,23,0.9);
   padding:15px;
   border-radius:12px;
   box-shadow:0 0 10px #38bdf8;
}

.card input{
   width:100%;
   padding:8px;
   margin-top:8px;
}

.card button{
   width:100%;
   margin-top:8px;
   padding:8px;
   border:none;
   background:#38bdf8;
   cursor:pointer;
}

.notificacao{
   position:fixed;
   top:20px;
   right:20px;
   background:#38bdf8;
   color:black;
   padding:10px 20px;
   border-radius:10px;
   display:none;
}
</style>
</head>
<body>

<canvas id="particulas"></canvas>

<div id="loginTela">
   <h1>🎮 MOCHILA ULTRA LOGIN</h1>
   <input type="text" id="userName" placeholder="Digite seu nome">
   <button onclick="entrarSistema()">ENTRAR</button>
</div>

<!-- SONS -->
<audio id="clickSound" src="click.mp3"></audio>
<audio id="selectSound" src="select.mp3"></audio>
<audio id="saveSound" src="save.mp3"></audio>
<audio id="music" src="music.mp3" loop></audio>

<div class="notificacao" id="notificacao"></div>

<div class="sidebar">
   <div class="logo">🚀 MOCHILA ULTRA 2.0</div>
   <div class="avatar">👨‍💻</div>
   <div id="nomeAluno">Aluno</div>

   <div class="xpBar"><span></span></div>

   <h2>🔍 Buscar</h2>
   <input type="text" placeholder="Pesquisar..." onkeyup="filtrar(this.value)">

   <h2>📚 Matérias</h2>
   <div id="listaMaterias"></div>

   <div class="atalhos">
      <h2>🚀 Atalhos</h2>
      <a href="aula.html" onclick="playClick()">💻 S.O JOÃO</a>
      <a href="direitoshumanos.html" onclick="playClick()">📘 D.H</a>
      <a href="placaM.html" onclick="playClick()">🖥 P.M</a>
   </div>
</div>

<div class="content">

   <div class="statusbar">
      <div id="clock">00:00:00</div>
      <div id="contador">Tempo Estudado: 0 min</div>
   </div>

   <div class="topbar">
      <h1 id="titulo">Selecione uma matéria</h1>

      <div class="actions">
         <button onclick="novo()">➕ Novo</button>
         <button onclick="salvar()">💾 Salvar</button>
         <button onclick="exportar()">📄 Exportar</button>
         <button onclick="modoEscuro()">🌙 Tema</button>
      </div>
   </div>

   <textarea id="editor" placeholder="Digite seus estudos aqui..."></textarea>

   <div class="painelExtra">

      <div class="card">
         <h3>✅ Tarefas</h3>
         <input type="text" id="tarefaInput" placeholder="Nova tarefa">
         <button onclick="addTarefa()">Adicionar</button>
         <div id="tarefas"></div>
      </div>

      <div class="card">
         <h3>🧮 Calculadora</h3>
         <input type="text" id="calc" placeholder="2+2">
         <button onclick="calcular()">Calcular</button>
         <div id="resultadoCalc"></div>
      </div>

      <div class="card">
         <h3>🔒 Bloco Secreto</h3>
         <textarea id="segredo" style="height:100px;"></textarea>
      </div>

   </div>
</div>
<script>

let materias = [
"Matemática","Português","História","Geografia","Biologia",
"Química","Física","HTML","CSS","POO Java","Lógica"
];

let materiaAtual = "";
let minutos = 0;

/* ================= SONS ================= */
function playClick(){ document.getElementById("clickSound").play(); }
function playSelect(){ document.getElementById("selectSound").play(); }
function playSave(){ document.getElementById("saveSound").play(); }

/* ================= LOGIN ================= */
function entrarSistema(){
   let nome = document.getElementById("userName").value;
   if(nome=="") return alert("Digite seu nome!");

   document.getElementById("nomeAluno").innerText = "👨‍🎓 "+nome;
   document.getElementById("loginTela").style.display="none";

   let music = document.getElementById("music");
   music.volume = 0.2;
   music.play();

   mostrarNotificacao("Bem-vindo, "+nome+"!");
}

/* ================= LOAD ================= */
window.onload = function(){
   carregarLista();
   setInterval(atualizarRelogio,1000);
   setInterval(contarTempo,60000);

   setInterval(()=>{
      if(materiaAtual!=""){
         localStorage.setItem(materiaAtual,document.getElementById("editor").value);
      }

      localStorage.setItem("segredo",document.getElementById("segredo").value);
   },4000);

   document.getElementById("segredo").value = localStorage.getItem("segredo") || "";

   iniciarParticulas();
}

/* ================= RELÓGIO ================= */
function atualizarRelogio(){
   let a = new Date();
   let h = String(a.getHours()).padStart(2,'0');
   let m = String(a.getMinutes()).padStart(2,'0');
   let s = String(a.getSeconds()).padStart(2,'0');

   document.getElementById("clock").innerText = h+":"+m+":"+s;
}

/* ================= CONTADOR ================= */
function contarTempo(){
   minutos++;
   document.getElementById("contador").innerText = "Tempo Estudado: "+minutos+" min";
}

/* ================= MATÉRIAS ================= */
function carregarLista(){
   let lista = document.getElementById("listaMaterias");
   lista.innerHTML="";

   materias.forEach(nome=>{
      let btn = document.createElement("button");
      btn.innerText = nome;

      btn.onclick = ()=>{
         playSelect();
         abrirMateria(nome);
      };

      lista.appendChild(btn);
   });
}

function abrirMateria(nome){
   materiaAtual = nome;
   document.getElementById("titulo").innerText = nome;
   document.getElementById("editor").value = localStorage.getItem(nome) || "";
}

function salvar(){
   if(materiaAtual=="") return alert("Escolha uma matéria!");
   localStorage.setItem(materiaAtual,document.getElementById("editor").value);
   playSave();
   mostrarNotificacao("💾 Salvo!");
}

function novo(){
   playClick();
   let nome = prompt("Nome da nova matéria:");
   if(nome){
      materias.push(nome);
      carregarLista();
      mostrarNotificacao("➕ Matéria criada!");
   }
}

function exportar(){
   playClick();
   if(materiaAtual=="") return alert("Escolha uma matéria!");

   let blob = new Blob([document.getElementById("editor").value],{type:"text/plain"});
   let a = document.createElement("a");
   a.href = URL.createObjectURL(blob);
   a.download = materiaAtual+".txt";
   a.click();

   mostrarNotificacao("📄 Exportado!");
}

function filtrar(valor){
   let botoes = document.querySelectorAll("#listaMaterias button");

   botoes.forEach(btn=>{
      btn.style.display = btn.innerText.toLowerCase().includes(valor.toLowerCase()) ? "block":"none";
   });
}

/* ================= TEMA ================= */
function modoEscuro(){
   playClick();
   document.body.classList.toggle("dark");
   mostrarNotificacao("🌙 Tema alterado!");
}

/* ================= NOTIFICAÇÃO ================= */
function mostrarNotificacao(msg){
   let n = document.getElementById("notificacao");
   n.innerText = msg;
   n.style.display="block";

   setTimeout(()=>{
      n.style.display="none";
   },2000);
}

/* ================= TAREFAS ================= */
function addTarefa(){
   let txt = document.getElementById("tarefaInput").value;
   if(txt=="") return;

   let div = document.createElement("div");
   div.innerHTML = "✔ "+txt;
   document.getElementById("tarefas").appendChild(div);

   document.getElementById("tarefaInput").value="";
}

/* ================= CALCULADORA ================= */
function calcular(){
   let conta = document.getElementById("calc").value;

   try{
      document.getElementById("resultadoCalc").innerText = "Resultado: "+eval(conta);
   }catch{
      document.getElementById("resultadoCalc").innerText = "Conta inválida";
   }
}

/* ================= PARTÍCULAS ================= */
function iniciarParticulas(){
   const canvas = document.getElementById("particulas");
   const ctx = canvas.getContext("2d");

   canvas.width = window.innerWidth;
   canvas.height = window.innerHeight;

   let particulas = [];

   for(let i=0;i<100;i++){
      particulas.push({
         x:Math.random()*canvas.width,
         y:Math.random()*canvas.height,
         r:Math.random()*3,
         d:Math.random()*2
      });
   }

   function desenhar(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle="rgba(56,189,248,0.8)";
      particulas.forEach(p=>{
         ctx.beginPath();
         ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
         ctx.fill();
      });

      mover();
   }

   let angle=0;
   function mover(){
      angle +=0.01;
      particulas.forEach((p,i)=>{
         p.y += Math.cos(angle+p.d)+1+p.r/2;
         p.x += Math.sin(angle)*2;

         if(p.x>canvas.width || p.x<0 || p.y>canvas.height){
            particulas[i]={x:Math.random()*canvas.width,y:0,r:p.r,d:p.d};
         }
      });
   }

   setInterval(desenhar,33);
}

/* SOM AO DIGITAR */
document.addEventListener("keydown",()=>{
   let s=document.getElementById("clickSound");
   s.currentTime=0;
   s.play();
});

/* ================= CALENDÁRIO ================= */
function gerarCalendario(){
   let hoje = new Date();
   let dia = hoje.getDate();
   let mes = hoje.getMonth()+1;
   let ano = hoje.getFullYear();

   document.getElementById("calendario").innerHTML =
   "Hoje: "+dia+"/"+mes+"/"+ano+"<br>Provas: Organize seus estudos!";
}

/* ================= TERMINAL HACKER ================= */
let msgs = [
"[SYSTEM] Mochila iniciada...",
"[LOADING] Matérias carregadas...",
"[OK] Sistema online...",
"[USER] Bem-vindo estudante...",
"[DATA] Salvamento automático ativo..."
];

function terminalGamer(){
   let t = document.getElementById("terminal");
   let i = 0;

   setInterval(()=>{
      if(i < msgs.length){
         t.innerHTML += msgs[i]+"<br>";
         t.scrollTop = t.scrollHeight;
         i++;
      }
   },1500);
}

/* ================= XP DINÂMICO ================= */
function subirXP(){
   let barra = document.querySelector(".xpBar span");
   let largura = 65;

   setInterval(()=>{
      if(largura < 100){
         largura += 1;
         barra.style.width = largura+"%";
      }
   },60000);
}

/* ================= RESET ================= */
function resetarSistema(){
   let conf = confirm("Deseja apagar TUDO?");
   if(conf){
      localStorage.clear();
      location.reload();
   }
gerarCalendario();
terminalGamer();
subirXP();
   window.onload = function(){
   carregarLista();
   setInterval(atualizarRelogio,1000);
   setInterval(contarTempo,60000);
   gerarCalendario();
   terminalGamer();
   subirXP();
</script>
   </body>
</html>
